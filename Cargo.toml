[package]
name = "nginxrs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An Nginx-compatible HTTP server and reverse proxy built on Cloudflare Pingora"
license = "Apache-2.0"

[features]
default = ["rustls"]
rustls = [
    "pingora-core/rustls",
    "pingora-proxy/rustls",
    "pingora-load-balancing/rustls",
]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
base64 = "0.22"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
glob = "0.3"
hex = "0.4"
http = "1.3"
httpdate = "1.0"
log = "0.4"
mime_guess = "2.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }
parking_lot = "0.12"
percent-encoding = "2.3"
pingora-cache = { version = "0.9.1", features = ["rustls"] }
pingora-core = { version = "0.9.1", features = ["rustls"] }
pingora-http = "0.9.1"
pingora-load-balancing = { version = "0.9.1", features = ["rustls"] }
pingora-proxy = { version = "0.9.1", features = ["rustls"] }
pingora-rustls = "0.9.1"
rand = "0.8"
regex = "1.12"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.48", features = ["full"] }
tokio-rustls = "0.26"
url = "2.5"
x509-parser = "0.16"

[[test]]
name = "static_and_lua"
path = "tests/core/static_and_lua.rs"

[[test]]
name = "realip"
path = "tests/core/realip.rs"

[[test]]
name = "access_and_limits"
path = "tests/core/access_and_limits.rs"

[[test]]
name = "lifecycle"
path = "tests/core/lifecycle.rs"

[[test]]
name = "request_shaping"
path = "tests/proxy/request_shaping.rs"

[[test]]
name = "response_rewriting"
path = "tests/proxy/response_rewriting.rs"

[[test]]
name = "next_upstream"
path = "tests/proxy/next_upstream.rs"

[[test]]
name = "buffering"
path = "tests/proxy/buffering.rs"

[[test]]
name = "cache"
path = "tests/proxy/cache.rs"

[[test]]
name = "error_pages"
path = "tests/proxy/error_pages.rs"

[[test]]
name = "headers"
path = "tests/proxy/headers.rs"

[[test]]
name = "handshake"
path = "tests/tls/handshake.rs"

[[test]]
name = "reject_handshake"
path = "tests/tls/reject_handshake.rs"

[[test]]
name = "sessions_and_stapling"
path = "tests/tls/sessions_and_stapling.rs"

[[test]]
name = "early_data_and_http2"
path = "tests/tls/early_data_and_http2.rs"
# End-to-end tests. Each file under `tests/` is a separate test crate, so the grouping
# directories are declared explicitly. Shared helpers live in `tests/support/` and are
# pulled in with `#[path = "../support/mod.rs"] mod support;`.
[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
