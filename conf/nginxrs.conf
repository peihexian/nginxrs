worker_processes auto;
pid nginxrs.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log ../logs/access.log combined;

    # ngx_http_limit_req_module：每客户端 10 r/s，突发 20，超限返回 429。
    limit_req_zone $binary_remote_addr zone=req:10m rate=10r/s;
    # ngx_http_limit_conn_module：每客户端最多 32 个并发请求。
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream backend {
        least_conn;
        server 127.0.0.1:9001 weight=1;
        server 127.0.0.1:9002 weight=1;
        health_check interval=2s;
    }

    server {
        listen 8080 default_server;
        server_name localhost;
        root ../www;
        index index.html;

        # nginxrs 扩展：限流的默认拒绝状态码。
        limit_req_status 429;
        limit_conn_status 429;

        # ngx_http_realip_module：仅在直连对端属于受信代理时才改写客户端地址。
        # 默认全部注释，按实际代理网段取消注释后使用。
        # set_real_ip_from 127.0.0.1;
        # set_real_ip_from 10.0.0.0/8;
        # real_ip_header X-Forwarded-For;
        # real_ip_recursive on;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # ngx_http_stub_status_module：连接/请求计数（Nginx 原格式）。
        location = /status {
            stub_status;
        }

        # nginxrs 扩展：Prometheus 文本格式指标。
        location = /metrics {
            prometheus_metrics;
        }

        # ngx_http_access_module：只允许内网访问后台。
        location = /admin/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location = /client {
            content_by_lua_block "ngx.say('remote=' .. ngx.var.remote_addr .. ' origin=' .. ngx.var.realip_remote_addr)";
        }

        location = /lua {
            content_by_lua_file lua/content.lua;
        }

        location /api/ {
            limit_req zone=req burst=20 nodelay;
            limit_conn conn 32;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream_tries 2;
        }

        location /legacy/ {
            rewrite ^/legacy/(.*)$ /media/$1 permanent;
        }

        # HLS/DASH 清单、分片及 MP4 均使用流式响应；支持单区间 Range。
        location /media/ {
            add_header Cache-Control "public, max-age=60" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # 下游 HTTPS 示例，需要真实证书后启用：
    # server {
    #     listen 8443 ssl;
    #     ssl_certificate ../conf/certs/server.crt;
    #     ssl_certificate_key ../conf/certs/server.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     location / { return 200 "secure\n"; }
    # }
}

